[project]
name = "eurolex-rag"
version = "0.1.0"
description = "Self-hostable RAG assistant over EU law (GDPR, AI Act) with article-level citations and a reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.161.1",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
tracing = [
    "langfuse>=5.0.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eurolex"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["eurolex"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["FlagEmbedding", "FlagEmbedding.*", "rank_bm25", "langfuse", "langfuse.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]

[tool.coverage.run]
source = ["eurolex"]
branch = true

# CUDA build on Windows (dev GPU), small CPU build on Linux/CI. See docs/adr/005.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
