name: e7_threshold
description: E1s retrieval + qwen2.5 answers, refuse below the dev threshold
retrieval:
  collection: eurolex_article
  chunker: article
  retrievers:
    - type: dense
  recitals: support
  support_k: 3
  top_k: 10
generation:
  enabled: true
  model: qwen2.5:7b-instruct
  # different from the answer model; also wrote some candidate questions, but it only grades
  judge_model: mistral:latest
  context_k: 8
  # picked on dev by `python -m eurolex.evaluation.threshold` (ADR 009)
  threshold: 0.5003
