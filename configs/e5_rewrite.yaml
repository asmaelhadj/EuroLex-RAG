name: e5_rewrite
description: E4 + LLM query rewriting (original question + rewrite)
retrieval:
  collection: eurolex_article
  chunker: article
  retrievers:
    - type: dense
      top_k: 50
    - type: sparse
      top_k: 50
  fusion:
    k: 60
  rerank:
    enabled: true
    candidates: 50
  rewrite:
    enabled: true
    mode: expand
    # differs from mistral, which generated the candidate questions
    model: llama3.2:3b
    # run on CPU: the 4 GB GPU cannot hold it next to the reranker
    gpu_layers: 0
  top_k: 10
