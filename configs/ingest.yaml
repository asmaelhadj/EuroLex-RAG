# Corpus and chunking settings for `make ingest`.
# Expected counts are checked after parsing; a mismatch is an error, not a warning.

raw_dir: data/raw
processed_dir: data/processed

acts:
  - act_id: gdpr
    celex: "32016R0679"
    raw_filename: gdpr_en.html
    short_name: GDPR
    expected_articles: 99
    expected_recitals: 173
  - act_id: ai_act
    celex: "32024R1689"
    raw_filename: ai_act_en.html
    short_name: AI Act
    expected_articles: 113
    expected_recitals: 180
    # GDPR-only scope for now (docs/adr/004-gdpr-only-scope.md).
    enabled: false

download:
  # Publications Office CELLAR content negotiation (see docs/adr/002-corpus-source.md).
  cellar_url_template: "http://publications.europa.eu/resource/celex/{celex}"
  # Human-facing citation link stored on every chunk.
  source_url_template: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:{celex}"
  timeout_seconds: 60

chunking:
  article:
    # Articles above this size are split per paragraph, and paragraphs above it into parts.
    max_tokens: 512
  fixed:
    size_tokens: 256
    overlap_tokens: 32

embedding:
  model: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  # Longest article-aware chunk is 512 words (~700 subword tokens); longer input is truncated
  # and reported by the indexer.
  max_length: 1024
  batch_size: 8
  device: auto  # cuda if available, else cpu
  precision: fp32

index:
  upsert_batch_size: 64
  collections:
    - name: eurolex_article
      chunker: article
      prepend_header: true
    - name: eurolex_fixed
      chunker: fixed
      # The naive baseline gets no structural hints.
      prepend_header: false
